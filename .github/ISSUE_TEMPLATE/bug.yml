name: Bug report
description: Something Rabbit did wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Leave out your tracker site, company and customer names.
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: /rabbit:pull
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude --version` and the Rabbit version from `claude plugin list`.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Claude Desktop, Terminal]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
